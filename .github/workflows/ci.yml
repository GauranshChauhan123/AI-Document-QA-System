name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKERHUB_USERNAME: gauranshchauhan123

jobs:
  # ────────────────────────────────────────────
  # Lint backend code
  # ────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lint tools
        run: pip install flake8 black isort
      - name: Lint with flake8
        run: flake8 backend --count --show-source --statistics
        continue-on-error: true
      - name: Check code formatting with Black
        run: black --check backend frontend
        continue-on-error: true

  # ────────────────────────────────────────────
  # Run backend tests
  # ────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-backend.txt pytest
      - name: Run tests
        run: pytest backend/test*.py -v
        continue-on-error: true

  # ────────────────────────────────────────────
  # Build Docker images (no push yet)
  # ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    if: always()
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            image_name: pdf-qa-backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            image_name: pdf-qa-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/${{ matrix.service }}-image.tar

      - name: Upload ${{ matrix.service }} image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp/${{ matrix.service }}-image.tar
          retention-days: 1

  # ────────────────────────────────────────────
  # Integration test: docker compose up
  # ────────────────────────────────────────────
  integration-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load Docker images
        run: |
          docker load --input /tmp/backend-image.tar
          docker load --input /tmp/frontend-image.tar

      - name: Tag images for docker compose
        run: |
          docker tag pdf-qa-backend:latest pdf-qa-backend:latest
          docker tag pdf-qa-frontend:latest pdf-qa-frontend:latest

      - name: Create .env for compose (with secrets from GitHub)
        run: echo "GEMINI_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env

      - name: Start services with docker compose
        run: docker compose up -d --no-build

      - name: Wait for backend to become healthy
        run: |
          echo "Waiting for backend health endpoint..."
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' pdf_qa_backend 2>/dev/null || echo "starting")
            echo "Attempt $i/30 — status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time"
          docker compose logs backend
          exit 1

      - name: Smoke-test backend health endpoint from runner
        run: |
          curl -f http://localhost:8000/health

      - name: Check frontend is running
        run: |
          FRONTEND_STATUS=$(docker inspect --format='{{.State.Status}}' pdf_qa_frontend)
          echo "Frontend container status: $FRONTEND_STATUS"
          if [ "$FRONTEND_STATUS" != "running" ]; then
            echo "Frontend container is not running"
            docker compose logs frontend
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Backend logs ==="
          docker compose logs backend
          echo "=== Frontend logs ==="
          docker compose logs frontend

  # ────────────────────────────────────────────
  # Push to Docker Hub (main branch only)
  # ────────────────────────────────────────────
  push-images:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
            image: gauranshchauhan123/pdf-qa-backend
          - service: frontend
            dockerfile: frontend/Dockerfile
            image: gauranshchauhan123/pdf-qa-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
